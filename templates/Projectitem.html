<div class="border-bottom row" style="margin-bottom: 16px;">
    <div class="col-9">
        <h4 style="color: grey;  margin-bottom: 4px; padding-bottom:8px">
            {{project['title']}}
        </h4>
        <div>
            <b>Programming Languages</b>: {{project['language']}}
        </div>
        <div>
            <b>Libraries</b>: {{project['libraries']}}
        </div>
        {% if 'framework' in project %}
        <div>
            <b>Framework</b>: {{project['framework']}}
        </div>
        {% endif %}
        {% if 'description' in project %}
        <div>
            <b>Description</b>: {{project['description']}}
        </div>
        {% endif %}
    </div>
    <div class="col-3 gap-2 ">
        <!-- {% if 'Link' in project %}
        <a href="{{project['Link']}}" type="button" class="btn btn-primary">Github</a>
        {% else %}
        <a href="https://github.com/ChandanSinghMahar?tab=repositories" type="button" class="btn btn-primary">Github</a>
        {% endif %} -->
        <a href="/project/{{project['id']}}" button type="button" class="btn btn-outline-primary">Project</a>

    </div>
</div>
